# Production sur le serveur unlockers.ai (déployé par deploy/deploy.sh).
# Caddy (dépôt unlockers-infra) termine le HTTPS et route example-app.unlockers.ai
# vers example-app-web:3000.
# L'authentification passe par le Keycloak partagé du serveur (dépôt unlockers-infra),
# realm simple-app : https://auth.unlockers.ai/realms/simple-app
# Aucun port publié : les conteneurs exposés rejoignent le réseau partagé `web`.
# Secrets : .env à côté de ce fichier sur le serveur, généré au premier déploiement.
name: example-app

services:
  web:
    container_name: example-app-web
    build:
      context: .
      args:
        VITE_OIDC_AUTHORITY: https://auth.unlockers.ai/realms/simple-app
    environment:
      OIDC_ISSUER: https://auth.unlockers.ai/realms/simple-app
      # Clés lues par le réseau `web`, sans repasser par Caddy.
      OIDC_JWKS_URL: http://auth-keycloak:8080/realms/simple-app/protocol/openid-connect/certs
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@example-app-postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [web, internal]

  postgres:
    container_name: example-app-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [internal]

networks:
  web:
    external: true
    name: web
  internal:

volumes:
  postgres_data:
