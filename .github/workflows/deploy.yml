name: Deploy

# À chaque push sur main : vérifie le typage, puis déploie sur le serveur unlockers.ai
# avec deploy/deploy.sh (rsync + docker compose over ssh) → https://example-app.unlockers.ai
#
# Secrets du repo (clé dédiée `gha-example-app` dans ~deploy/.ssh/authorized_keys) :
#   DEPLOY_SSH_KEY      — clé privée autorisée pour l'utilisateur deploy
#   HETZNER_HOST        — IP du serveur
#   HETZNER_USER        — utilisateur ssh (deploy)
#   DEPLOY_KNOWN_HOSTS  — sortie de `ssh-keyscan -H <host>`, épingle la clé du serveur

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName $HETZNER_HOST
            User $HETZNER_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          CFG

      - name: Deploy
        run: ./deploy/deploy.sh
        env:
          DEPLOY_HOST: deploy-target
